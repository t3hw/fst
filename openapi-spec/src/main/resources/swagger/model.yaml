openapi: 3.0.1
info:
  version: 1.0.0
  title: MiniHackerNews API
  contact:
    name: Ravid Gontov
tags:
  - name: FsTest
    description: MiniHackerNews endpoints

paths:
  /fstest/posts:
    get:
      tags:
        - fstest
      summary: Get all posts
      description: Returns a list of all posts
      operationId: getPosts
      responses:
        "200":
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostDTO"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
    post:
      tags:
        - fstest
      summary: Create a new post
      description: Creates a new post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostDTO"
      responses:
        "201":
          description: Post created successfully
          content:
            application/json:
              schema:
                # $ref: '#/components/schemas/IdDTO'
                $ref: "#/components/schemas/PostDTO"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

  /fstest/posts/{id}:
    patch:
      tags:
        - fstest
      summary: Upvote or downvote a post
      description: Upvotes or downvotes a post
      operationId: upvotePost
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the post to upvote or downvote
          schema:
            type: integer
            format: int64
        - name: action
          in: query
          required: true
          description: The action to perform (upvote or downvote)
          schema:
            type: string
            enum:
              - upvote
              - downvote
      responses:
        "200":
          description: Post upvoted or downvoted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDTO"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDTO"

components:
  schemas:
    # PostDAO:
    #   x-class-extra-annotation: |
    #     @lombok.AllArgsConstructor
    #     @lombok.NoArgsConstructor
    #   properties:
    #     id:
    #       type: integer
    #       format: int64
    #     content:
    #       type: string

    IdDTO:
      required:
        - id
      properties:
        id:
          type: integer
          format: int64

    PostDTO:
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string
        votes:
          type: integer
          format: int32

    CreatePostDTO:
      required:
        - content
      properties:
        content:
          type: string

    ErrorResponseDTO:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        exception:
          type: string
        message:
          type: string
        path:
          type: string
